<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src https: http: data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Image</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #111;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
      }

      img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <img id="image" alt="Image" referrerpolicy="no-referrer" />
    <script>
      const params = new URLSearchParams(window.location.hash.slice(1));
      const source = params.get("src");
      const title = params.get("title") || "Image";
      document.title = title;
      const image = document.getElementById("image");
      image.alt = title;
      if (source) image.src = source;
    </script>
  </body>
</html>
