name: pre-deploy-gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npx tsc --noEmit && npm run build

  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high+ vulnerabilities
        run: npm audit --audit-level=high

  model_eval:
    name: Model Eval Gate
    runs-on: ubuntu-latest
    env:
      MODEL_EVAL_ENDPOINT: ${{ secrets.MODEL_EVAL_ENDPOINT }}
      MODEL_EVAL_ROUTE: "/server/make-server-e35291a5/generate-brand-data"
      MODEL_EVAL_API_KEY: ${{ secrets.MODEL_EVAL_API_KEY }}
      MODEL_EVAL_EMAIL: ${{ secrets.MODEL_EVAL_EMAIL }}
      MODEL_EVAL_PASSWORD: ${{ secrets.MODEL_EVAL_PASSWORD }}
      MODEL_EVAL_SUPABASE_ANON_KEY: ${{ secrets.MODEL_EVAL_SUPABASE_ANON_KEY }}
      MODEL_EVAL_ACCESS_TOKEN: ${{ secrets.MODEL_EVAL_ACCESS_TOKEN }}
      MODEL_EVAL_TIMEOUT_MS: "30000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate model eval secrets
        run: |
          if [ -z "$MODEL_EVAL_ENDPOINT" ]; then
            echo "Missing MODEL_EVAL_ENDPOINT secret."
            exit 1
          fi

          if [ -n "$MODEL_EVAL_API_KEY" ]; then
            echo "Using static MODEL_EVAL_API_KEY."
            exit 0
          fi

          if [ -z "$MODEL_EVAL_EMAIL" ] || [ -z "$MODEL_EVAL_PASSWORD" ] || [ -z "$MODEL_EVAL_SUPABASE_ANON_KEY" ]; then
            echo "Missing auth secrets. Provide MODEL_EVAL_API_KEY, or MODEL_EVAL_EMAIL + MODEL_EVAL_PASSWORD + MODEL_EVAL_SUPABASE_ANON_KEY."
            exit 1
          fi

          echo "Using dynamic Supabase auth for model eval."

      - name: Run model eval gate
        run: node scripts/eval-model.mjs
